<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>תקציב משפחתי</title>
<meta name="theme-color" content="#f4f6fb">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="תקציב">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* Layout idea: a phone app. Sticky top bar, one column of cards, bottom tab bar with four views (budget, history, analytics, settings). Light by default. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#111a2c; --muted:#5c667a; --line:#e2e6ef;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e6edfd;
  --good:#0b8a5c; --good-soft:#e0f4ec; --bad:#cf3b33; --bad-soft:#fce8e6;
  --warm:#c9631a; --warm-soft:#fcefe2;
  --hero:#15213b; --hero-ink:#ffffff; --hero-muted:#b3bed8; --hero-good:#7be0b6; --hero-bad:#ffa59c; --hero-line:rgba(255,255,255,.14);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s-other:#8a90a0;
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c111c; --surface:#151c2b; --ink:#e9edf6; --muted:#98a3b8; --line:#273147;
  --accent:#7ea2ff; --accent-ink:#0a1530; --accent-soft:#1b2947;
  --good:#4fd1a1; --good-soft:#12302a; --bad:#ff8a80; --bad-soft:#3a1c1c;
  --warm:#f0a35e; --warm-soft:#33261a;
  --hero:#1b2742; --hero-ink:#ffffff; --hero-muted:#b3bed8; --hero-good:#7be0b6; --hero-bad:#ffa59c; --hero-line:rgba(255,255,255,.14);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --s-other:#7c8496;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
.wrap{max-width:720px;margin-inline:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.ic{width:22px;height:22px;flex:none;display:block}
h2{margin:0}
p{margin:0}

/* top bar */
.appbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.appbar-in{max-width:688px;margin-inline:auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;flex:none}
.appbar h1{font-weight:800;font-size:1.25rem;line-height:1.2;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipleft{display:none;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chipleft.show{display:inline-block}
.chipleft.pos{color:var(--good)}
.chipleft.neg{color:var(--bad)}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);padding:0}
.ibtn.plain{border:0;background:none;color:var(--muted);width:40px;height:40px}
.ibtn.plain:hover{background:var(--bad-soft);color:var(--bad)}
.ibtn.plain.neutral:hover{background:var(--accent-soft);color:var(--accent)}
.ibtn.armed,.ibtn.plain.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ibtn .ic{width:20px;height:20px}

/* bottom tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;color:var(--muted);font-size:.75rem;font-weight:500;min-height:62px}
.tab span.pillic{display:inline-flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] span.pillic{background:var(--accent-soft)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:18px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.h-label{color:var(--hero-muted);font-weight:500}
.big{font-weight:800;font-size:2.9rem;line-height:1.1;letter-spacing:-.02em;text-align:start}
.big.pos{color:var(--hero-good)}
.big.neg{color:var(--hero-bad)}
.h-sub{color:var(--hero-muted);font-size:.85rem}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.14);color:var(--hero-ink)}
.pill.good{background:rgba(123,224,182,.18);color:var(--hero-good)}
.pill.bad{background:rgba(255,165,156,.18);color:var(--hero-bad)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:16px}
.trio .lbl{display:flex;align-items:center;gap:6px;color:var(--hero-muted);font-size:.85rem}
.trio b{display:block;font-size:1.15rem;font-weight:700;text-align:start}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;font-size:.78rem;color:var(--muted);font-weight:500;text-align:center;line-height:1.2}
.qbtn i{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--accent)}
.qbtn:active i{background:var(--accent-soft)}
.qbtn .ic{width:24px;height:24px}

.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:500;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:7px 12px;font-size:.9rem;min-height:38px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* cards and sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
.card-title{font-weight:800;font-size:1.1rem}
.view-title{font-weight:800;font-size:1.4rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec{overflow:hidden;--sec:var(--accent);--sec-soft:var(--accent-soft)}
.sec-income{--sec:var(--good);--sec-soft:var(--good-soft)}
.sec-expense{--sec:var(--warm);--sec-soft:var(--warm-soft)}
.sec-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sec-soft)}
.sec-head h2{font-weight:800;font-size:1.25rem;color:var(--sec);flex:1}
.sec-head .tot{font-weight:800;font-size:1.1rem}
.sec-head .tot small{font-weight:400;font-size:.8rem;color:var(--muted)}
.sec-add{width:40px;height:40px;border-radius:50%;border:0;background:var(--sec);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.note{padding:10px 16px;color:var(--muted);font-size:.875rem}
.grp-head{display:flex;align-items:center;border-top:1px solid var(--line)}
.grp-tgl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 16px;text-align:start;font-weight:700;min-height:52px}
.grp-tgl .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.cnt{font-weight:500;font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px}
.chev{width:8px;height:8px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-inline:2px 4px}
[aria-expanded="false"] > .chev{transform:rotate(135deg)}
.grp-head .ibtn{margin-inline-end:8px}
.row{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"name amt rm" "meta meta meta";gap:2px 6px;padding:8px 16px 8px 8px;border-top:1px solid var(--line);align-items:center}
.row .name{grid-area:name;min-width:0;overflow-wrap:anywhere;font-weight:500}
.row .name input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.row .ibtn{grid-area:rm}
.row .meta{grid-area:meta;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.amt{grid-area:amt;display:inline-flex;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding-inline:10px;direction:ltr;height:46px}
.amt:focus-within{border-color:var(--accent);background:var(--surface)}
.amt span{color:var(--muted);font-weight:500}
.amt input{width:92px;border:0;background:none;padding:6px;text-align:right;font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.amt input::placeholder{color:var(--muted);font-weight:400}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.row .meta select{font-size:.85rem;padding:2px 8px;border-radius:999px;color:var(--muted);min-height:28px}
.eq{font-size:.85rem;color:var(--muted)}
@media (min-width:640px){
  .row{grid-template-columns:1fr auto auto auto;grid-template-areas:"name meta amt rm"}
  .row .meta{flex-wrap:nowrap;flex-direction:row-reverse}
}
.empty{padding:16px;color:var(--muted);border-top:1px solid var(--line)}
.emptystate{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}

/* history */
.hcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow .m{font-weight:800;font-size:1.1rem;flex:1}
.hleft{font-weight:800;font-size:1.25rem}
.hleft.pos{color:var(--good)}
.hleft.neg{color:var(--bad)}
.htrio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.85rem;color:var(--muted)}
.htrio b{display:block;color:var(--ink);font-size:1rem}
.hdet{border:0;background:none;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;padding:8px 0;flex:1;text-align:start}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;align-items:center;gap:8px;min-width:0}
.list .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.list .pc{color:var(--muted);font-size:.85rem;min-width:2.8em;text-align:end}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-weight:800;font-size:1.6rem;line-height:1.2}
.kpi .l{color:var(--muted);font-size:.85rem}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:190px;height:190px;flex:none}
.donut-wrap .list{flex:1 1 240px}
.usebar{display:flex;gap:2px;height:18px;direction:ltr}
.usebar span{display:block;height:100%;border-radius:4px;min-width:3px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.hbar .t{min-width:0;overflow-wrap:anywhere}
.hbar .track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--bg);direction:rtl}
.hbar .track span{display:block;height:100%;border-radius:4px;background:var(--s1)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.875rem}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.sq{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.detail{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:.9rem}
.detail .full{grid-column:1 / -1;font-weight:700}

/* settings */
.set{overflow:hidden}
.set-title{padding:14px 16px 6px;font-weight:700;color:var(--muted);font-size:.85rem}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start;min-height:60px}
.set .set-title + .set-row{border-top:0}
.set-row .tile{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.set-row.danger .tile{background:var(--bad-soft);color:var(--bad)}
.set-row.armed{background:var(--bad-soft)}
.set-row .txt{flex:1;min-width:0}
.set-row .txt b{display:block;font-weight:500}
.set-row .txt small{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .ic{width:18px;height:18px}
.stepper{display:inline-flex;align-items:center;gap:8px;flex:none}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1;padding:0}
.stepper b{min-width:1.4em;text-align:center;font-weight:800;font-size:1.1rem}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,14,28,.55)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-weight:800;font-size:1.2rem;margin:0}
.dlg-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:46px}
.pick h4,.dlg-body h4{margin:10px 0 8px;font-size:.95rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;text-align:start;min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.custom{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > *{flex:1 1 150px}
.inline > .btn{flex:0 0 auto}
label.small{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
label.small .field,label.small select{color:var(--ink)}
.tpl{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tpl b{font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.chk{display:flex;gap:8px;align-items:center}

.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;text-align:center;font-weight:500;z-index:20;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .15s ease}}

.emptystate .tile{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#15213b"/><g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M150 372V150h142v150" stroke="#ffffff"/><path d="M220 212v150h142V140" stroke="#7be0b6"/></g></svg>
  <h1>תקציב משפחתי</h1>
  <span id="chipleft" class="chipleft num"></span>
  <button type="button" class="ibtn" id="sync" data-act="sync"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4.25 4.25 0 0 1 17.5 18z"/></svg></button>
  <button type="button" class="ibtn" data-act="refresh" aria-label="רענון" title="רענון"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></button>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="ניווט ראשי"><div class="tabs-in" id="tabs"></div></nav>
<dialog id="dlg"><div class="dlg" id="dlg-inner"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>

  s=s||state;
  if(G[gid])return {id:gid,sec:G[gid][0],name:G[gid][2],custom:false};
  for(var i=0;i<s.groups.length;i++)if(s.groups[i].id===gid)return {id:gid,sec:s.groups[i].sec,name:s.groups[i].name,custom:true};
  return null;
}
function groupsOf(sec){
  var out=G_ORDER.filter(function(g){return G[g][0]===sec;});
  state.groups.forEach(function(g){if(g.sec===sec)out.push(g.id);});
  return out;
}
function groupColor(g){return SLOT[g]?"var(--s"+SLOT[g]+")":"var(--s-other)";}
function itemName(it){if(it.key&&CK[it.key])return CK[it.key][3];return it.name||"";}
function perMonth(amount,freq){return amount/(freq==="y"?12:freq==="bi"?2:1);}
function monthly(it){return perMonth(it.amount,it.freq);}
function sumBy(fn){var s=0;state.items.forEach(function(it){if(fn(it))s+=monthly(it);});return s;}
function secOf(it){var g=groupInfo(it.group);return g?g.sec:null;}
function totals(){
  var inc=sumBy(function(it){return secOf(it)==="income";}),
      exp=sumBy(function(it){return secOf(it)==="expense";}),
      sav=sumBy(function(it){return secOf(it)==="savings";});
  return {inc:inc,exp:exp,sav:sav,left:inc-exp-sav};
}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
function monthLabel(m){var p=m.split("-");return MONTHS[Number(p[1])-1]+" "+p[0];}
function monthShort(m){var p=m.split("-");return Number(p[1])+"/"+p[0].slice(2);}
function thisMonth(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
function histSorted(){return state.history.slice().sort(function(a,b){return a.month<b.month?-1:a.month>b.month?1:0;});}
function toast(msg){
  var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show");},2600);
}
function confirmTap(btn,key){
  if(armed===key){armed=null;clearTimeout(armTimer);return true;}
  armed=key;btn.classList.add("armed");toast("לחצו שוב לאישור");
  clearTimeout(armTimer);armTimer=setTimeout(function(){armed=null;btn.classList.remove("armed");},3200);
  return false;
}

/* a dataset for analytics, from the live budget or from a saved month */
function dataNow(){
  var T=totals(),groups=[];
  ["income","expense","savings"].forEach(function(sec){groupsOf(sec).forEach(function(g){
    var v=sumBy(function(it){return it.group===g;});if(v>0)groups.push({id:g,name:groupInfo(g).name,sec:sec,amount:v});
  });});
  var items=state.items.filter(function(it){return it.amount>0;}).map(function(it){return {name:itemName(it),group:it.group,sec:secOf(it),monthly:monthly(it)};});
  return {inc:T.inc,exp:T.exp,sav:T.sav,left:T.left,kids:state.kids,groups:groups,items:items};
}
function makeSnap(month){
  var d=dataNow(),used={};
  var items=state.items.map(function(it){used[it.group]=1;return {key:it.key||null,name:it.key?null:it.name,group:it.group,freq:it.freq,amount:it.amount};});
  return {month:month,savedAt:Date.now(),kids:state.kids,inc:d.inc,exp:d.exp,sav:d.sav,left:d.left,groups:d.groups,items:items,
    cgroups:state.groups.filter(function(g){return used[g.id];}).map(function(g){return {id:g.id,name:g.name,sec:g.sec};})};
}
function dataOf(h){
  function sec(g){if(G[g])return G[g][0];var c=(h.cgroups||[]).filter(function(x){return x.id===g;})[0];return c?c.sec:"expense";}
  var items=h.items.filter(function(i){return i.amount>0;}).map(function(i){
    return {name:i.key&&CK[i.key]?CK[i.key][3]:(i.name||""),group:i.group,sec:sec(i.group),monthly:perMonth(i.amount,i.freq)};});
  return {inc:h.inc,exp:h.exp,sav:h.sav,left:h.left,kids:h.kids||0,groups:h.groups||[],items:items};
}

/* ---------- analytics view ---------- */
function expenseSlices(d){
  var named=[],other=0;
  d.groups.forEach(function(g){if(g.sec!=="expense")return;if(SLOT[g.id])named.push({name:g.name,amount:g.amount,color:groupColor(g.id),slot:SLOT[g.id]});else other+=g.amount;});
  named.sort(function(a,b){return a.slot-b.slot;});
  if(other>0)named.push({name:"אחר",amount:other,color:"var(--s-other)"});
  return named;
}
function donutSvg(slices,total,center1,center2){
  var r=70,C=2*Math.PI*r,off=0,out="";
  slices.forEach(function(s){
    var len=s.amount/total*C,vis=Math.max(len-2,0.5);
    out+='<circle cx="100" cy="100" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="28" stroke-dasharray="'+vis.toFixed(2)+' '+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"><title>'+esc(s.name)+': '+fmt(s.amount)+' ('+pct(s.amount,total)+')</title></circle>';
    off+=len;
  });
  return '<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="חלוקת ההוצאות לפי קבוצות"><g transform="rotate(-90 100 100)">'+out+'</g>'+
    '<text x="100" y="98" text-anchor="middle" style="font:800 22px var(--font);fill:var(--ink)" direction="ltr">'+center1+'</text>'+
    '<text x="100" y="120" text-anchor="middle" style="font:400 13px var(--font);fill:var(--muted)">'+center2+'</text></svg>';
}
function niceMax(v){
  if(v<=0)return 1000;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;
  var st=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];for(var i=0;i<st.length;i++)if(n<=st[i])return st[i]*p;return 10*p;
}
function topBar(x,y,w,h,col){
  if(h<=0)return "";var r=Math.min(4,h,w/2);
  return '<path fill="'+col+'" d="M'+x+' '+(y+h)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h)+'Z"/>';
}
function trendSvg(hs,sel){
  var W=360,H=230,ml=4,mr=4,mt=18,mb=28,n=hs.length,pw=W-ml-mr,ph=H-mt-mb;
  var max=0;hs.forEach(function(h){max=Math.max(max,h.inc,h.exp+h.sav);});max=niceMax(max);
  var out="";
  [0,0.5,1].forEach(function(f){
    var y=mt+ph-f*ph;
    out+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    if(f>0)out+='<text x="'+(ml+2)+'" y="'+(y-4)+'">'+fmt(max*f)+'</text>';
  });
  var band=pw/n,bw=Math.max(4,Math.min(22,band*0.3));
  hs.forEach(function(h,i){
    var cx=ml+band*i+band/2,hi=h.inc/max*ph,ho=(h.exp+h.sav)/max*ph;
    if(i===sel)out+='<rect x="'+(ml+band*i+2)+'" y="'+mt+'" width="'+(band-4)+'" height="'+ph+'" rx="6" fill="var(--accent-soft)"/>';
    out+=topBar(cx-bw-1,mt+ph-hi,bw,hi,"var(--s1)")+topBar(cx+1,mt+ph-ho,bw,ho,"var(--s2)");
    out+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle"'+(i===sel?' style="fill:var(--ink);font-weight:700"':"")+'>'+monthShort(h.month)+'</text>';
    out+='<rect x="'+(ml+band*i)+'" y="0" width="'+band+'" height="'+H+'" fill="transparent" data-act="trend" data-i="'+i+'" style="cursor:pointer"><title>'+monthLabel(h.month)+'</title></rect>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="הכנסות מול הוצאות וחיסכון לפי חודשים">'+out+'</svg>';
}
function viewAnalytics(el){
  document.getElementById("chipleft").classList.remove("show");
  var hsAll=histSorted(),h=anSrc==="now"?null:hsAll.filter(function(x){return x.month===anSrc;})[0];
  if(anSrc!=="now"&&!h)anSrc="now";
  var d=h?dataOf(h):dataNow();
  var html='<h2 class="view-title">אנליטיקה</h2>'+
    '<label class="small" for="an-src">הנתונים המוצגים<select id="an-src" class="field"><option value="now">התקציב הנוכחי</option>'+
    hsAll.slice().reverse().map(function(x){return '<option value="'+x.month+'"'+(x.month===anSrc?" selected":"")+'>'+monthLabel(x.month)+'</option>';}).join("")+'</select></label>';

  if(d.inc<=0&&d.exp<=0&&d.sav<=0){
    html+='<div class="card emptystate"><div class="tile">'+ic("chart")+'</div><p>אין עדיין סכומים להצגה.</p><p class="small">הזינו הכנסות והוצאות בלשונית התקציב.</p></div>';
  }else{
    /* key figures */
    var housing=0,kids=0;d.groups.forEach(function(g){if(g.id==="housing")housing=g.amount;if(g.id==="kids")kids=g.amount;});
    function kpi(v,l,s){return '<div class="kpi"><div class="v num">'+v+'</div><div class="l">'+l+(s?'<br>'+s:"")+'</div></div>';}
    html+='<section class="card pad"><h3 class="card-title" style="margin:0">מדדים מרכזיים</h3><div class="kpis">'+
      kpi(pct(d.sav,d.inc),"שיעור החיסכון מההכנסה")+
      kpi(pct(d.exp,d.inc),"הוצאות מתוך ההכנסה")+
      kpi(pct(housing,d.inc),"דיור מתוך ההכנסה",num(housing)+" לחודש")+
      kpi(pct(kids,d.inc),"ילדים מתוך ההכנסה",d.kids>0&&kids>0?num(kids/d.kids)+" לילד":num(kids)+" לחודש")+
      '</div></section>';

    /* where income goes */
    if(d.inc>0){
      var parts=[["הוצאות",d.exp,"var(--s2)"],["חיסכון",d.sav,"var(--s1)"],["נשאר",Math.max(d.left,0),"var(--s3)"]].filter(function(p){return p[1]>0;});
      var tot=Math.max(d.inc,d.exp+d.sav);
      html+='<section class="card pad"><h3 class="card-title" style="margin:0">מה קורה עם ההכנסה</h3><div class="usebar" role="img" aria-label="חלוקת ההכנסה">'+

        parts.map(function(p){return '<li><span class="sq" style="background:'+p[2]+'"></span><span class="nm">'+p[0]+'</span><b class="num">'+fmt(p[1])+'</b><span class="pc num">'+pct(p[1],d.inc)+'</span></li>';}).join("")+

        '</ul></div><p class="small muted">האחוזים הם מתוך סך ההוצאות.</p></section>';

      var mx=top[0].monthly;
      html+='<section class="card pad"><h3 class="card-title" style="margin:0">ההוצאות הגדולות ביותר</h3>'+top.map(function(i){

      }).join("")+'<p class="small muted">סכום חודשי, והאחוז מתוך סך ההוצאות.</p></section>';
    }

  /* trend across saved months */
  var hs=hsAll.slice(-12);

/* ---------- templates ---------- */
function tplItems(kind,id){
  if(kind==="ready"){
    var r=READY.filter(function(x){return x.id===id;})[0];if(!r)return null;
    return {groups:[],items:r.keys.split(" ").map(function(k){return {key:k,name:null,group:CK[k][1],freq:CK[k][4]};})};
  }
  return state.templates.filter(function(x){return x.id===id;})[0]||null;
}
function same(a,b){return a.key?a.key===b.key:(!b.key&&a.name===b.name&&a.group===b.group);}
function applyTpl(tpl,mode){
  (tpl.groups||[]).forEach(function(g){if(!groupInfo(g.id))state.groups.push({id:g.id,name:g.name,sec:g.sec});});
  var wasExample=state.example,old=state.items,next=mode==="replace"?[]:old.slice();
  tpl.items.forEach(function(ti){
    if(ti.key&&!CK[ti.key])return;
    if(!groupInfo(ti.group))return;
    var ex=old.filter(function(o){return same(ti,o);})[0];
    if(mode==="merge"&&ex)return;
    var amount=typeof ti.amount==="number"?ti.amount:(ex&&!(wasExample&&mode==="replace")?ex.amount:0);
    next.push({id:ex?ex.id:uid(),key:ti.key||null,name:ti.key?null:ti.name,group:ti.group,freq:ex&&typeof ti.amount!=="number"?ex.freq:ti.freq,amount:amount});
  });
  state.items=next;
  if(mode==="replace")state.example=false;
  pruneGroups();
}
function pruneGroups(){
  var keep={};
  state.templates.forEach(function(m){(m.groups||[]).forEach(function(g){keep[g.id]=1;});});
  state.groups=state.groups.filter(function(g){return keep[g.id]||state.items.some(function(it){return it.group===g.id;});});
}
function summaryText(){
  var T=totals(),lines=["תקציב משפחתי",""];
  ["income","expense","savings"].forEach(function(sec){
    lines.push(SEC_NAME[sec]+": "+fmt(sec==="income"?T.inc:sec==="expense"?T.exp:T.sav)+" לחודש");
    state.items.forEach(function(it){if(secOf(it)===sec&&it.amount>0)lines.push("  "+itemName(it)+": "+fmt(monthly(it)));});
    lines.push("");
  });
  lines.push("נשאר בכל חודש: "+fmt(T.left));
  return lines.join("\n");
}

/* ---------- Excel export ---------- */
function r2(n){return Math.round(n*100)/100;}
function loadXLSX(){
  return new Promise(function(ok,fail){
    if(window.XLSX)return ok(window.XLSX);
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=function(){window.XLSX?ok(window.XLSX):fail();};s.onerror=fail;
    document.head.appendChild(s);
  });
}
function budgetRows(){
  var rows=[["סוג","קבוצה","סעיף","סכום","תדירות","סכום חודשי"]];
  ["income","expense","savings"].forEach(function(sec){groupsOf(sec).forEach(function(g){
    state.items.forEach(function(it){if(it.group===g)rows.push([SEC_NAME[sec],groupInfo(g).name,itemName(it),r2(it.amount),FREQ[it.freq],r2(monthly(it))]);});
  });});
  return rows;
}
function downloadBlob(blob,name){
  var a=document.createElement("a"),u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);
}
function exportExcel(){
  toast("מכין את הקובץ…");
  var fname="family-budget-"+thisMonth();
  loadXLSX().then(function(X){
    var d=dataNow(),wb=X.utils.book_new();
    function sheet(name,rows,widths){var ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(function(w){return {wch:w};});X.utils.book_append_sheet(wb,ws,name);}
    var sum=[["תקציב משפחתי",monthLabel(thisMonth())],[],["הכנסות",r2(d.inc)],["הוצאות",r2(d.exp)],["חיסכון",r2(d.sav)],["נשאר בכל חודש",r2(d.left)],[],["קבוצה","סוג","סכום חודשי","אחוז מההכנסה"]];
    d.groups.forEach(function(g){sum.push([g.name,SEC_NAME[g.sec],r2(g.amount),d.inc>0?r2(g.amount/d.inc*100):""]);});
    sheet("סיכום",sum,[26,12,14,14]);
    sheet("תקציב",budgetRows(),[10,26,40,12,14,14]);
    var hs=histSorted(),hrows=[["חודש","הכנסות","הוצאות","חיסכון","נשאר"]],drows=[["חודש","סוג","קבוצה","סעיף","סכום חודשי"]];
    hs.forEach(function(h){
      hrows.push([monthLabel(h.month),r2(h.inc),r2(h.exp),r2(h.sav),r2(h.left)]);
      var hd=dataOf(h),gname={};(h.groups||[]).forEach(function(g){gname[g.id]=g.name;});
      hd.items.forEach(function(i){drows.push([monthLabel(h.month),SEC_NAME[i.sec],gname[i.group]||"",i.name,r2(i.monthly)]);});
    });
    sheet("היסטוריה",hrows,[16,12,12,12,12]);
    sheet("היסטוריה - פירוט",drows,[16,10,26,40,14]);
    wb.Workbook={Views:[{RTL:true}]};
    X.writeFile(wb,fname+".xlsx");
    toast("קובץ האקסל ירד למכשיר");
  }).catch(function(){
    var csv="﻿"+budgetRows().map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
    try{downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),fname+".csv");toast("לא ניתן היה ליצור קובץ xlsx. ירד קובץ CSV שנפתח באקסל");}
    catch(e){toast("ההורדה נכשלה. בדקו את החיבור לאינטרנט ונסו שוב");}
  });
}

  }
  else if(act==="copy"){
    try{navigator.clipboard.writeText(summaryText()).then(function(){toast("הסיכום הועתק");},function(){toast("ההעתקה נכשלה");});}catch(err){toast("ההעתקה נכשלה");}
  }
  else if(act==="excel"){exportExcel();}
  else if(act==="rm"){state.items=state.items.filter(function(it){return it.id!==id;});pruneGroups();persist();drawSections();}
  else if(act==="rm-group"){
    if(!confirmTap(b,"g:"+id))return;
    state.items=state.items.filter(function(it){return it.group!==id;});pruneGroups();persist();drawSections();
  }
  else if(act==="tgl"){collapsed[id]=!collapsed[id];saveUi();document.getElementById("quick").innerHTML=quickHtml();drawSections();}
  else if(act==="tgl-all"){var all=allCollapsed();shownGroups().forEach(function(g){collapsed[g]=!all;});saveUi();document.getElementById("quick").innerHTML=quickHtml();drawSections();}
  else if(act==="open-add"){openDialog("add",b.getAttribute("data-sec"));}
  else if(act==="open-tpl"){openDialog("tpl");}
  else if(act==="open-gh"){openDialog("gh");}
  else if(act==="open-save"){openDialog("save");}
  else if(act==="gh-off"){ghDisconnect();drawDialog();}
  else if(act==="close"){closeDialog();}
  else if(act==="toggle"){
    var key=b.getAttribute("data-key"),has=state.items.some(function(it){return it.key===key;});
    if(has)state.items=state.items.filter(function(it){return it.key!==key;});else{state.items.push(mkItem(key,0));collapsed[CK[key][1]]=false;}
    b.setAttribute("aria-pressed",String(!has));persist();drawSections();
  }
  else if(act==="tpl-use"||act==="tpl-merge"){
    var tpl=tplItems(b.getAttribute("data-kind"),id);if(!tpl)return;
    applyTpl(tpl,act==="tpl-use"?"replace":"merge");persist();closeDialog();go("budget");
  }
  else if(act==="tpl-del"){
    if(!confirmTap(b,"t:"+id))return;
    state.templates=state.templates.filter(function(m){return m.id!==id;});pruneGroups();persist();drawDialog();
  }
  else if(act==="h-tgl"){openHist[id]=!openHist[id];renderAll();}
  else if(act==="h-view"){anSrc=id;go("analytics");}
  else if(act==="h-del"){
    if(!confirmTap(b,"h:"+id))return;
    state.history=state.history.filter(function(h){return h.month!==id;});persist();renderAll();toast("החודש נמחק מההיסטוריה");
  }
  else if(act==="h-restore"){
    if(!confirmTap(b,"r:"+id))return;
    var h=state.history.filter(function(x){return x.month===id;})[0];if(!h)return;
    applyTpl({items:h.items,groups:h.cgroups||[]},"replace");persist();go("budget");toast("התקציב של "+monthLabel(id)+" נטען");
  }
  else if(act==="trend"){trendSel=Number(b.getAttribute("data-i"));var y=window.scrollY;renderAll();window.scrollTo(0,y);}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-amt")){var it=find(el.getAttribute("data-amt"));if(!it)return;var v=parseFloat(el.value);it.amount=isFinite(v)&&v>0?v:0;persist();refreshFigures();}
  else if(el.hasAttribute("data-name")){var it2=find(el.getAttribute("data-name"));if(it2){it2.name=el.value.slice(0,60);persist();}}
  else if(el.id==="pick-q"){dlgFilter=el.value;document.getElementById("pick").innerHTML=pickHtml();}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute("data-freq")){var it=find(el.getAttribute("data-freq"));if(it){it.freq=el.value;persist();refreshFigures();}}
  else if(el.id==="c-group"){var ng=document.getElementById("c-newgroup");ng.hidden=el.value!=="__new";ng.required=el.value==="__new";if(!ng.hidden)ng.focus();}
  else if(el.id==="an-src"){anSrc=el.value;renderAll();}
  else if(el.id==="save-m"||el.id==="save-y"){saveNote();}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="custom-form"){
    var name=document.getElementById("c-name").value.trim(),g=document.getElementById("c-group").value;
    if(!name)return;
    if(g==="__new"){
      var gn=document.getElementById("c-newgroup").value.trim();if(!gn)return;
      g="g"+uid();state.groups.push({id:g,name:gn,sec:dlgSec});
    }
    state.items.push({id:uid(),key:null,name:name,group:g,freq:"m",amount:0});collapsed[g]=false;
    persist();drawSections();drawDialog();toast("הסעיף נוסף");
  }else if(e.target.id==="gh-form"){
    var cfg={};["owner","repo","branch","path","token"].forEach(function(k){cfg[k]=document.getElementById("gh-"+k).value.trim();});
    cfg.path=cfg.path.replace(/^\/+/,"");
    if(!cfg.owner||!cfg.repo||!cfg.branch||!cfg.path||!cfg.token)return;
    ghConnect(cfg);drawDialog();
  }else if(e.target.id==="save-form"){
    var m=saveMonthValue();
    state.history=state.history.filter(function(h){return h.month!==m;});
    state.history.push(makeSnap(m));
    persist();closeDialog();toast(monthLabel(m)+" נשמר בהיסטוריה");
    if(view!=="budget")renderAll();
  }else if(e.target.id==="tpl-form"){
    var tn=document.getElementById("tpl-name").value.trim();if(!tn)return;
    var withAmt=document.getElementById("tpl-amounts").checked,used={};
    var items=state.items.map(function(it){used[it.group]=1;var o={key:it.key||null,name:it.key?null:it.name,group:it.group,freq:it.freq};if(withAmt)o.amount=it.amount;return o;});
    state.templates.push({id:"t"+uid(),name:tn,items:items,groups:state.groups.filter(function(g){return used[g.id];}).map(function(g){return {id:g.id,name:g.name,sec:g.sec};})});
    persist();drawDialog();toast("התבנית נשמרה");
  }
});

/* ---------- no page zoom ---------- */
["gesturestart","gesturechange","gestureend"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener("wheel",function(e){if(e.ctrlKey||e.metaKey)e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&/^[+\-=0]$/.test(e.key))e.preventDefault();});

/* ---------- start ---------- */
state=load();
gh=ghLoadCfg();
setTheme(curTheme());
renderAll();
if(gh)ghPull();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&gh&&!ghBusy&&!ghDirty&&!dlgMode)ghPull();});
})();
</script>
</body>
