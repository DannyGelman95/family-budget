<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Israeli Family Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow ledger column; a summary slip on top, then income, expenses and savings as ruled ledger groups. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15262b; --muted:#5b6d71; --line:#d8e0de;
  --accent:#0b6e75; --accent-ink:#ffffff; --accent-soft:#e2f1f1;
  --good:#1c7847; --bad:#b3372b; --good-soft:#e3f3ea; --bad-soft:#fbe7e4;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1618; --surface:#162124; --ink:#e7efed; --muted:#93a6a9; --line:#293a3d;
    --accent:#56bcc2; --accent-ink:#04282b; --accent-soft:#173437;
    --good:#62c990; --bad:#f08e80; --good-soft:#173326; --bad-soft:#3b1f1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162124; --ink:#e7efed; --muted:#93a6a9; --line:#293a3d;
  --accent:#56bcc2; --accent-ink:#04282b; --accent-soft:#173437;
  --good:#62c990; --bad:#f08e80; --good-soft:#173326; --bad-soft:#3b1f1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin-inline:auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 14px;font-size:.9rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.summary{padding:18px;display:flex;flex-direction:column;gap:16px}
.sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1.05}
.big.neg{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);padding-top:14px}
.trio .v{font-weight:600;font-size:1.05rem}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:.88rem}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
.legend .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.stepper{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 6px 4px 12px}
[dir="rtl"] .stepper{padding:4px 12px 4px 6px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.1rem;line-height:1}
.stepper b{min-width:1.4em;text-align:center}
.status{margin-inline-start:auto;font-size:.82rem;color:var(--muted)}

.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}

.sec{overflow:hidden}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px 6px}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0}
.sec-head .tot{font-weight:600;font-size:1.1rem}
.note{padding:0 18px 8px;margin:0;color:var(--muted);font-size:.85rem;max-width:65ch}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--bg);border-block:1px solid var(--line);font-weight:500;font-size:.92rem}
.grp-head .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:1.15rem;line-height:1;flex:none}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name rm" "ctl ctl";gap:6px 8px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.row .name{grid-area:name;min-width:0;overflow-wrap:anywhere}
.row .name input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.row .ctl{grid-area:ctl;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .x{grid-area:rm}
.amt{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding-inline:8px;direction:ltr}
.amt:focus-within{border-color:var(--accent)}
.amt span{color:var(--muted)}
.amt input{width:96px;border:0;background:none;padding:8px 6px;text-align:right;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}
.eq{font-size:.82rem;color:var(--muted)}
@media (min-width:600px){
  .row{grid-template-columns:1fr auto auto;grid-template-areas:"name ctl rm"}
  .row .ctl{flex-wrap:nowrap;justify-content:flex-end}
}
.sec-foot{padding:12px 18px}
.empty{padding:14px 18px;color:var(--muted);margin:0}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,20,22,.55)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-family:var(--display);font-size:1.25rem;margin:0}
.dlg-body{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.pick h4,.dlg-body h4{margin:8px 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.9rem;text-align:start}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.custom{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > *{flex:1 1 150px}
label.small{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
label.small .field{color:var(--ink)}
.inline > .btn{flex:0 0 auto}
.tpl{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tpl b{font-weight:600}
.tpl .acts{display:flex;gap:8px;flex-wrap:wrap}
label.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-act="lang" data-v="en">English</button>
      <button type="button" id="lang-he" data-act="lang" data-v="he">עברית</button>
    </div>
  </header>
  <section class="card summary" id="summary" aria-live="polite"></section>
  <div class="tools" id="tools"></div>
  <div id="banner"></div>
  <div id="sections" style="display:flex;flex-direction:column;gap:20px"></div>
</div>
<dialog id="dlg"><div class="dlg" id="dlg-inner"></div></dialog>

var STORE="il-family-budget-v1";
var state,cloudRef=null,cloudOn=false,localOk=true,saveTimer=null,saving=false,dirty=false;
var dlgMode=null,dlgSec=null,dlgFilter="";
function uid(){return "i"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function mkItem(key,amount){var c=CK[key];return {id:uid(),key:key,name:null,group:c[1],freq:c[4],amount:amount||0};}
function fresh(){
  var s={v:1,lang:"en",kids:2,example:true,items:[],groups:[],templates:[],updatedAt:0};
  READY[0].keys.split(" ").forEach(function(k){s.items.push(mkItem(k,EXAMPLE[k]));});
  return s;
}
function normalize(s){
  if(!s||typeof s!=="object"||!Array.isArray(s.items))return fresh();
  s.lang=s.lang==="he"?"he":"en";
  s.kids=Math.max(0,Math.min(15,parseInt(s.kids,10)||0));
  s.groups=Array.isArray(s.groups)?s.groups:[];
  s.templates=Array.isArray(s.templates)?s.templates:[];
  s.items=s.items.filter(function(it){return it&&it.id&&(groupInfo(it.group,s)||false);});
  s.items.forEach(function(it){it.amount=Math.max(0,Number(it.amount)||0);if(!/^(m|bi|y)$/.test(it.freq))it.freq="m";});
  s.updatedAt=Number(s.updatedAt)||0;
  return s;
}
function load(){
  try{var raw=localStorage.getItem(STORE);if(raw)return normalize(JSON.parse(raw));}catch(e){localOk=false;}
  return fresh();
}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(STORE,JSON.stringify(state));localOk=true;}catch(e){localOk=false;}
  if(cloudRef){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,1500);}
  if(gh){ghDirty=true;clearTimeout(ghTimer);ghTimer=setTimeout(ghPush,3000);}
  drawStatus();
}
function pushCloud(){
  if(!cloudRef||saving||!dirty)return;
  saving=true;dirty=false;
  cloudRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt}).then(function(){
    saving=false;cloudOn=true;drawStatus();if(dirty)pushCloud();
  },function(){saving=false;cloudOn=false;cloudRef=null;drawStatus();});
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc("data/users/"+id+"/budget");
      return ref.get().then(function(snap){
        cloudRef=ref;cloudOn=true;
        if(snap.exists){
          var d=snap.data(),remote=null;
          try{remote=JSON.parse(d.json);}catch(e){}
          if(remote&&Number(remote.updatedAt)>state.updatedAt){
            var lang=state.lang;state=normalize(remote);
            try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
            renderAll();
          }else if(state.updatedAt>0){dirty=true;pushCloud();}
        }else if(state.updatedAt>0){dirty=true;pushCloud();}
        drawStatus();
      });
    });
  }).catch(function(){});
}

var GH_STORE="il-family-budget-gh",gh=null,ghSha=null,ghState="",ghTimer=null,ghBusy=false,ghDirty=false;
function ghLoadCfg(){try{var r=localStorage.getItem(GH_STORE);if(r){var c=JSON.parse(r);if(c&&c.token&&c.owner&&c.repo&&c.path)return c;}}catch(e){}return null;}
function ghDefaults(){
  var o="DannyGelman95",r="family-budget",m=/^([^.]+)\.github\.io$/i.exec(location.hostname||"");
  if(m){o=m[1];var seg=location.pathname.split("/").filter(Boolean)[0];if(seg&&!/\.html?$/i.test(seg))r=seg;}
  return {owner:o,repo:r,branch:"main",path:"data/budget.json",token:""};
}
function ghRepoUrl(){return "https://api.github.com/repos/"+encodeURIComponent(gh.owner)+"/"+encodeURIComponent(gh.repo);}
function ghUrl(){return ghRepoUrl()+"/contents/"+gh.path.split("/").filter(Boolean).map(encodeURIComponent).join("/");}
function ghHeaders(){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28"};}
function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b){var s=atob(String(b).replace(/\s/g,"")),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}
function ghSet(k){ghState=k;drawStatus();var e=document.getElementById("gh-msg");if(e)e.textContent=k?t(k):"";}
function ghFail(code){ghSet(code===401||code===403?"ghErrAuth":code===404?"ghErrNotFound":"ghErrNet");}
function adopt(remote){
  var lang=state.lang;state=normalize(remote);state.lang=lang;
  try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
  drawHeader();drawTools();drawSections();
}
function ghGet(){
  return fetch(ghUrl()+"?ref="+encodeURIComponent(gh.branch),{headers:ghHeaders(),cache:"no-store"}).then(function(res){
    if(res.status===404)return null;
    if(!res.ok)throw res.status;
    return res.json();
  });
}
function ghPull(){
  if(!gh||ghBusy)return;
  ghBusy=true;ghSet("ghLoading");
  ghGet().then(function(j){
    ghBusy=false;
    var remote=null;
    if(j){ghSha=j.sha;try{remote=JSON.parse(b64dec(j.content));}catch(e){}}else ghSha=null;
    var rAt=remote?Number(remote.updatedAt)||0:-1;
    if(remote&&rAt>state.updatedAt){adopt(remote);ghSet("ghSynced");if(ghDirty)ghPush();}
    else if(!remote||state.updatedAt>rAt){if(!state.updatedAt)state.updatedAt=1;ghDirty=true;ghPush();}
    else{ghSet("ghSynced");if(ghDirty)ghPush();}
  }).catch(function(err){ghBusy=false;ghFail(typeof err==="number"?err:0);});
}
function ghPush(retried){
  if(!gh||ghBusy||!ghDirty)return;
  ghBusy=true;ghDirty=false;ghSet("ghSaving");
  var body={message:"Update budget data",content:b64enc(JSON.stringify(state,null,2)+"\n"),branch:gh.branch};
  if(ghSha)body.sha=ghSha;
  fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)}).then(function(res){
    if((res.status===409||res.status===422)&&retried!==true){
      return ghGet().then(function(j){ghSha=j?j.sha:null;ghBusy=false;ghDirty=true;ghPush(true);});
    }
    if(!res.ok)throw res.status;
    return res.json().then(function(j){
      ghSha=j&&j.content?j.content.sha:ghSha;ghBusy=false;ghSet("ghSynced");
      if(ghDirty)ghPush();
    });
  }).catch(function(err){ghBusy=false;ghDirty=true;ghFail(typeof err==="number"?err:0);});
}
function ghConnect(cfg){
  gh=cfg;ghSha=null;ghDirty=false;
  try{localStorage.setItem(GH_STORE,JSON.stringify(cfg));}catch(e){}
  ghSet("ghLoading");
  fetch(ghRepoUrl(),{headers:ghHeaders(),cache:"no-store"}).then(function(res){
    if(!res.ok)throw res.status;
    return res.json();
  }).then(function(j){
    if(j&&j.permissions&&j.permissions.push===false)throw 403;
    ghPull();
  }).catch(function(err){ghFail(typeof err==="number"?err:0);});
}
function ghDisconnect(){
  gh=null;ghSha=null;ghDirty=false;ghState="";clearTimeout(ghTimer);
  try{localStorage.removeItem(GH_STORE);}catch(e){}
  drawStatus();
}

/* ---------- helpers ---------- */
function t(k){return L[state.lang][k]||L.en[k]||k;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){var r=Math.round(Math.abs(n));return (n<0&&r>0?"−":"")+"₪"+r.toLocaleString("en-US");}
function groupInfo(gid,s){
  s=s||state;
  if(G[gid])return {id:gid,sec:G[gid][0],name:s.lang==="he"?G[gid][2]:G[gid][1],custom:false};
  for(var i=0;i<s.groups.length;i++)if(s.groups[i].id===gid)return {id:gid,sec:s.groups[i].sec,name:s.groups[i].name,custom:true};
  return null;
}
function groupsOf(sec){
  var out=G_ORDER.filter(function(g){return G[g][0]===sec;});
  state.groups.forEach(function(g){if(g.sec===sec)out.push(g.id);});
  return out;
}
function allGroupIds(){return G_ORDER.concat(state.groups.map(function(g){return g.id;}));}
function groupColor(gid){var i=allGroupIds().indexOf(gid);return "hsl("+((i*47+12)%360)+" 52% 52%)";}
function itemName(it){if(it.key&&CK[it.key])return state.lang==="he"?CK[it.key][3]:CK[it.key][2];return it.name||"";}
function monthly(it){return it.amount/(it.freq==="y"?12:it.freq==="bi"?2:1);}
function sumBy(fn){var s=0;state.items.forEach(function(it){if(fn(it))s+=monthly(it);});return s;}
function secOf(it){var g=groupInfo(it.group);return g?g.sec:null;}
function totals(){
  var inc=sumBy(function(it){return secOf(it)==="income";}),
      exp=sumBy(function(it){return secOf(it)==="expense";}),
      sav=sumBy(function(it){return secOf(it)==="savings";});
  return {inc:inc,exp:exp,sav:sav,left:inc-exp-sav};
}

      var sub=0;items.forEach(function(it){sub+=monthly(it);});
      body+="<div class=\"grp-head\"><span class=\"dot\" style=\"background:"+(sec==="expense"?groupColor(g):"var(--accent)")+"\"></span><span class=\"nm\">"+esc(groupInfo(g).name)+"</span><span class=\"num\" data-sub=\""+g+"\">"+fmt(sub)+"</span><button type=\"button\" class=\"x\" data-act=\"rm-group\" data-id=\""+g+"\" aria-label=\""+t("removeGroup")+": "+esc(groupInfo(g).name)+"\" title=\""+t("removeGroup")+"\">×</button></div>";
      body+=items.map(rowHtml).join("");
    });
    if(!body)body="<p class=\"empty\">"+t("empty")+"</p>";
    html+="<section class=\"card sec\"><div class=\"sec-head\"><h2>"+t(sec)+"</h2><span class=\"tot num\" data-tot=\""+sec+"\"></span></div>"+
      (sec==="savings"?"<p class=\"note\">"+t("savNote")+"</p>":"")+body+
      "<div class=\"sec-foot\"><button type=\"button\" class=\"btn\" data-act=\"open-add\" data-sec=\""+sec+"\">+ "+t("add_"+sec)+"</button></div></section>";
  });
  document.getElementById("sections").innerHTML=html;
  refreshFigures();
}
function refreshFigures(){
  var T=totals(),map={income:T.inc,expense:T.exp,savings:T.sav};
  document.querySelectorAll("[data-tot]").forEach(function(el){el.textContent=fmt(map[el.getAttribute("data-tot")])+" "+t("perMonth");});
  document.querySelectorAll("[data-sub]").forEach(function(el){var g=el.getAttribute("data-sub");el.textContent=fmt(sumBy(function(it){return it.group===g;}));});
  document.querySelectorAll("[data-eq]").forEach(function(el){
    var it=find(el.getAttribute("data-eq"));
    el.textContent=it&&it.freq!=="m"&&it.amount>0?"= "+fmt(monthly(it))+" "+t("perMonth"):"";
  });
  drawSummary();
}
function renderAll(){drawHeader();drawTools();drawSections();if(dlgMode)drawDialog();}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}

/* ---------- dialogs ---------- */
var dlg=document.getElementById("dlg"),dlgInner=document.getElementById("dlg-inner");
function openDialog(mode,sec){dlgMode=mode;dlgSec=sec||null;dlgFilter="";drawDialog();if(!dlg.open){try{dlg.showModal();}catch(e){dlg.setAttribute("open","");}}}
function closeDialog(){dlgMode=null;if(dlg.open)dlg.close();}
dlg.addEventListener("close",function(){dlgMode=null;});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDialog();});
function head(title){return "<div class=\"dlg-head\"><h3>"+title+"</h3><button type=\"button\" class=\"x\" data-act=\"close\" aria-label=\""+t("close")+"\">×</button></div>";}
function pickHtml(){
  var q=dlgFilter.trim().toLowerCase(),out="";
  groupsOf(dlgSec).forEach(function(g){
    var chips=C.filter(function(c){return c[1]===g&&(!q||c[2].toLowerCase().indexOf(q)>-1||c[3].indexOf(q)>-1);}).map(function(c){
      var on=state.items.some(function(it){return it.key===c[0];});
      return "<button type=\"button\" class=\"chip\" data-act=\"toggle\" data-key=\""+c[0]+"\" aria-pressed=\""+on+"\">"+esc(state.lang==="he"?c[3]:c[2])+"</button>";
    }).join("");
    if(chips)out+="<h4>"+esc(groupInfo(g).name)+"</h4><div class=\"chips\">"+chips+"</div>";
  });
  return out||"<p class=\"muted\">"+t("empty")+"</p>";
}
function drawDialog(){
  if(dlgMode==="add"){
    var opts=groupsOf(dlgSec).map(function(g){return "<option value=\""+g+"\">"+esc(groupInfo(g).name)+"</option>";}).join("")+"<option value=\"__new\">"+t("newGroup")+"</option>";
    dlgInner.innerHTML=head(t("add_"+dlgSec))+"<div class=\"dlg-body\">"+
      "<input type=\"search\" class=\"field\" id=\"pick-q\" placeholder=\""+t("search")+"\" aria-label=\""+t("search")+"\">"+
      "<div class=\"pick\" id=\"pick\">"+pickHtml()+"</div>"+
      "<form class=\"custom\" id=\"custom-form\"><h4 style=\"margin:0\">"+t("custom")+"</h4><div class=\"inline\">"+
      "<input type=\"text\" class=\"field\" id=\"c-name\" placeholder=\""+t("customName")+"\" aria-label=\""+t("customName")+"\" maxlength=\"60\" required>"+
      "<select id=\"c-group\" aria-label=\""+t("newGroupName")+"\">"+opts+"</select></div>"+
      "<div class=\"inline\"><input type=\"text\" class=\"field\" id=\"c-newgroup\" placeholder=\""+t("newGroupName")+"\" aria-label=\""+t("newGroupName")+"\" maxlength=\"40\" hidden>"+
      "<button type=\"submit\" class=\"btn primary\">"+t("addBtn")+"</button></div></form></div>";
  }else if(dlgMode==="gh"){
    var c=gh||ghDefaults();
    function f(id,key,val,type){return "<label class=\"small\" for=\""+id+"\">"+t(key)+"<input type=\""+(type||"text")+"\" class=\"field\" id=\""+id+"\" value=\""+esc(val)+"\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" dir=\"ltr\" required></label>";}
    dlgInner.innerHTML=head(t("ghTitle"))+"<div class=\"dlg-body\"><p class=\"small\" style=\"margin:0\">"+t("ghIntro")+"</p>"+
      "<form id=\"gh-form\" style=\"display:flex;flex-direction:column;gap:10px\">"+
      "<div class=\"inline\">"+f("gh-owner","ghOwner",c.owner)+f("gh-repo","ghRepo",c.repo)+"</div>"+
      "<div class=\"inline\">"+f("gh-branch","ghBranch",c.branch)+f("gh-path","ghPath",c.path)+"</div>"+
      f("gh-token","ghToken",c.token,"password")+
      "<p class=\"small muted\" style=\"margin:0\">"+t("ghTokenHint")+"</p>"+
      "<div class=\"tpl acts\" style=\"border:0;padding:0;flex-direction:row\"><button type=\"submit\" class=\"btn primary\">"+t("ghConnect")+"</button>"+
      (gh?"<button type=\"button\" class=\"btn ghost danger\" data-act=\"gh-off\">"+t("ghDisconnect")+"</button>":"")+"</div>"+
      "<p id=\"gh-msg\" role=\"status\" style=\"margin:0;font-weight:500\">"+(gh&&ghState?t(ghState):"")+"</p></form></div>";
  }else if(dlgMode==="tpl"){
    var ready=READY.map(function(r){
      return "<div class=\"tpl\"><div><b>"+esc(state.lang==="he"?r.he:r.en)+"</b> <span class=\"muted small\">· "+r.keys.split(" ").length+" "+t("items")+"</span></div><div class=\"acts\"><button type=\"button\" class=\"btn sm primary\" data-act=\"tpl-use\" data-kind=\"ready\" data-id=\""+r.id+"\">"+t("replace")+"</button><button type=\"button\" class=\"btn sm\" data-act=\"tpl-merge\" data-kind=\"ready\" data-id=\""+r.id+"\">"+t("merge")+"</button></div></div>";
    }).join("");
    var mine=state.templates.length?state.templates.map(function(m){
      return "<div class=\"tpl\"><div><b>"+esc(m.name)+"</b> <span class=\"muted small\">· "+m.items.length+" "+t("items")+"</span></div><div class=\"acts\"><button type=\"button\" class=\"btn sm primary\" data-act=\"tpl-use\" data-kind=\"mine\" data-id=\""+m.id+"\">"+t("replace")+"</button><button type=\"button\" class=\"btn sm\" data-act=\"tpl-merge\" data-kind=\"mine\" data-id=\""+m.id+"\">"+t("merge")+"</button><button type=\"button\" class=\"btn sm ghost danger\" data-act=\"tpl-del\" data-id=\""+m.id+"\">"+t("del")+"</button></div></div>";
    }).join(""):"<p class=\"muted\" style=\"margin:0\">"+t("noMine")+"</p>";
    dlgInner.innerHTML=head(t("templates"))+"<div class=\"dlg-body\">"+
      "<h4 style=\"margin:0\">"+t("mine")+"</h4>"+mine+
      "<form class=\"custom\" id=\"tpl-form\" style=\"border-top:0;padding-top:0\"><div class=\"inline\"><input type=\"text\" class=\"field\" id=\"tpl-name\" placeholder=\""+t("tplName")+"\" aria-label=\""+t("tplName")+"\" maxlength=\"50\" required><button type=\"submit\" class=\"btn\">"+t("save")+"</button></div>"+
      "<label class=\"chk\"><input type=\"checkbox\" id=\"tpl-amounts\"> "+t("withAmounts")+"</label><span class=\"muted small\">"+t("saveTpl")+"</span></form>"+
      "<h4 style=\"margin:0\">"+t("ready")+"</h4><p class=\"muted small\" style=\"margin:0\">"+t("replaceHint")+"</p>"+ready+"</div>";
  }
}

/* ---------- templates ---------- */
function tplItems(kind,id){
  if(kind==="ready"){
    var r=READY.filter(function(x){return x.id===id;})[0];if(!r)return null;
    return {groups:[],items:r.keys.split(" ").map(function(k){return {key:k,name:null,group:CK[k][1],freq:CK[k][4]};})};
  }
  return state.templates.filter(function(x){return x.id===id;})[0]||null;
}
function same(a,b){return a.key?a.key===b.key:(!b.key&&a.name===b.name&&a.group===b.group);}
function applyTpl(tpl,mode){
  (tpl.groups||[]).forEach(function(g){if(!groupInfo(g.id))state.groups.push({id:g.id,name:g.name,sec:g.sec});});
  var wasExample=state.example,old=state.items,next=mode==="replace"?[]:old.slice();
  tpl.items.forEach(function(ti){
    if(ti.key&&!CK[ti.key])return;
    if(!groupInfo(ti.group))return;
    var ex=old.filter(function(o){return same(ti,o);})[0];
    if(mode==="merge"){if(ex)return;}
    var amount=typeof ti.amount==="number"?ti.amount:(ex&&!(wasExample&&mode==="replace")?ex.amount:0);
    next.push({id:ex?ex.id:uid(),key:ti.key||null,name:ti.key?null:ti.name,group:ti.group,freq:ex&&typeof ti.amount!=="number"?ex.freq:ti.freq,amount:amount});
  });
  state.items=next;
  if(mode==="replace")state.example=false;
  pruneGroups();
}
function pruneGroups(){
  var inTpl={};state.templates.forEach(function(m){(m.groups||[]).forEach(function(g){inTpl[g.id]=1;});});
  state.groups=state.groups.filter(function(g){return inTpl[g.id]||state.items.some(function(it){return it.group===g.id;});});
}
function summaryText(){
  var T=totals(),lines=[t("title"),""];
  ["income","expense","savings"].forEach(function(sec){
    lines.push(t(sec)+": "+fmt(sec==="income"?T.inc:sec==="expense"?T.exp:T.sav)+" "+t("perMonth"));
    state.items.forEach(function(it){if(secOf(it)===sec&&it.amount>0)lines.push("  "+itemName(it)+": "+fmt(monthly(it)));});
    lines.push("");
  });
  lines.push(t("left")+": "+fmt(T.left));
  return lines.join("\n");
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(act==="lang"){state.lang=b.getAttribute("data-v");persist();renderAll();}
  else if(act==="kids"){state.kids=Math.max(0,Math.min(15,state.kids+Number(b.getAttribute("data-v"))));document.getElementById("kids-n").textContent=state.kids;persist();drawSummary();}
  else if(act==="clear"){state.items.forEach(function(it){it.amount=0;});state.example=false;persist();renderAll();}
  else if(act==="copy"){
    var txt=summaryText();
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy");},1600);},function(){});}catch(err){}
  }
  else if(act==="rm"){state.items=state.items.filter(function(it){return it.id!==id;});pruneGroups();persist();drawSections();}
  else if(act==="rm-group"){state.items=state.items.filter(function(it){return it.group!==id;});pruneGroups();persist();drawSections();}
  else if(act==="open-add"){openDialog("add",b.getAttribute("data-sec"));}
  else if(act==="open-tpl"){openDialog("tpl");}
  else if(act==="open-gh"){openDialog("gh");}
  else if(act==="gh-off"){ghDisconnect();drawDialog();}
  else if(act==="close"){closeDialog();}
  else if(act==="toggle"){
    var key=b.getAttribute("data-key"),has=state.items.some(function(it){return it.key===key;});
    if(has)state.items=state.items.filter(function(it){return it.key!==key;});else state.items.push(mkItem(key,0));
    b.setAttribute("aria-pressed",String(!has));persist();drawSections();
  }
  else if(act==="tpl-use"||act==="tpl-merge"){
    var tpl=tplItems(b.getAttribute("data-kind"),id);if(!tpl)return;
    applyTpl(tpl,act==="tpl-use"?"replace":"merge");persist();closeDialog();renderAll();
  }
  else if(act==="tpl-del"){state.templates=state.templates.filter(function(m){return m.id!==id;});pruneGroups();persist();drawDialog();}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-amt")){var it=find(el.getAttribute("data-amt"));if(!it)return;var v=parseFloat(el.value);it.amount=isFinite(v)&&v>0?v:0;persist();refreshFigures();}
  else if(el.hasAttribute("data-name")){var it2=find(el.getAttribute("data-name"));if(it2){it2.name=el.value.slice(0,60);persist();}}
  else if(el.id==="pick-q"){dlgFilter=el.value;document.getElementById("pick").innerHTML=pickHtml();}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute("data-freq")){var it=find(el.getAttribute("data-freq"));if(it){it.freq=el.value;persist();refreshFigures();}}
  else if(el.id==="c-group"){var ng=document.getElementById("c-newgroup");ng.hidden=el.value!=="__new";ng.required=el.value==="__new";if(!ng.hidden)ng.focus();}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="custom-form"){
    var name=document.getElementById("c-name").value.trim(),g=document.getElementById("c-group").value;
    if(!name)return;
    if(g==="__new"){
      var gn=document.getElementById("c-newgroup").value.trim();if(!gn)return;
      g="g"+uid();state.groups.push({id:g,name:gn,sec:dlgSec});
    }
    state.items.push({id:uid(),key:null,name:name,group:g,freq:"m",amount:0});
    persist();drawSections();drawDialog();
  }else if(e.target.id==="gh-form"){
    var cfg={};["owner","repo","branch","path","token"].forEach(function(k){cfg[k]=document.getElementById("gh-"+k).value.trim();});
    cfg.path=cfg.path.replace(/^\/+/,"");
    if(!cfg.owner||!cfg.repo||!cfg.branch||!cfg.path||!cfg.token)return;
    ghConnect(cfg);drawDialog();
  }else if(e.target.id==="tpl-form"){
    var tn=document.getElementById("tpl-name").value.trim();if(!tn)return;
    var withAmt=document.getElementById("tpl-amounts").checked,used={};
    var items=state.items.map(function(it){used[it.group]=1;var o={key:it.key||null,name:it.key?null:it.name,group:it.group,freq:it.freq};if(withAmt)o.amount=it.amount;return o;});
    state.templates.push({id:"t"+uid(),name:tn,items:items,groups:state.groups.filter(function(g){return used[g.id];}).map(function(g){return {id:g.id,name:g.name,sec:g.sec};})});
    persist();drawDialog();
  }
});

/* ---------- start ---------- */
state=load();
gh=ghLoadCfg();
renderAll();
initCloud();
if(gh)ghPull();
document.addEventListener("visibilitychange",function(){if(!document.hidden&&gh&&!ghBusy&&!ghDirty&&!dlgMode)ghPull();});
})();
</script>
