<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תקציב משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* Layout idea: one calm column for the phone. A dark result card on top, then income, expenses and savings as colour-coded cards with foldable groups. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#111a2c; --muted:#5c667a; --line:#e1e5ee;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e6edfd;
  --good:#0b8a5c; --good-soft:#e0f4ec; --bad:#cf3b33; --bad-soft:#fce8e6;
  --warm:#c9631a; --warm-soft:#fcefe2;
  --hero:#15213b; --hero-ink:#ffffff; --hero-muted:#b3bed8; --hero-good:#7be0b6; --hero-bad:#ffa59c; --hero-line:rgba(255,255,255,.14);
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111c; --surface:#151c2b; --ink:#e9edf6; --muted:#98a3b8; --line:#273147;
    --accent:#7ea2ff; --accent-ink:#0a1530; --accent-soft:#1b2947;
    --good:#4fd1a1; --good-soft:#12302a; --bad:#ff8a80; --bad-soft:#3a1c1c;
    --warm:#f0a35e; --warm-soft:#33261a;
    --hero:#1b2742; --hero-ink:#ffffff; --hero-muted:#b3bed8; --hero-good:#7be0b6; --hero-bad:#ffa59c; --hero-line:rgba(255,255,255,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111c; --surface:#151c2b; --ink:#e9edf6; --muted:#98a3b8; --line:#273147;
  --accent:#7ea2ff; --accent-ink:#0a1530; --accent-soft:#1b2947;
  --good:#4fd1a1; --good-soft:#12302a; --bad:#ff8a80; --bad-soft:#3a1c1c;
  --warm:#f0a35e; --warm-soft:#33261a;
  --hero:#1b2742; --hero-ink:#ffffff; --hero-muted:#b3bed8; --hero-good:#7be0b6; --hero-bad:#ffa59c; --hero-line:rgba(255,255,255,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin-inline:auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
h1{font-weight:800;font-size:1.7rem;line-height:1.15;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.82rem;color:var(--muted);text-align:start;max-width:100%}
.status span{overflow-wrap:anywhere}

.stick{position:fixed;top:0;inset-inline:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateY(-110%);font-weight:500}
.stick.show{transform:none}
.stick b{font-size:1.15rem;font-weight:800}
.stick .pos{color:var(--good)}
.stick .neg{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.stick{transition:transform .2s ease}.bar span{transition:width .25s ease}.chev{transition:transform .15s ease}}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.h-label{color:var(--hero-muted);font-weight:500}
.big{font-weight:800;font-size:2.9rem;line-height:1.1;letter-spacing:-.02em;text-align:start}
.big.pos{color:var(--hero-good)}
.big.neg{color:var(--hero-bad)}
.h-sub{color:var(--hero-muted);font-size:.85rem}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.14);color:var(--hero-ink)}
.pill.good{background:rgba(123,224,182,.18);color:var(--hero-good)}
.pill.bad{background:rgba(255,165,156,.18);color:var(--hero-bad)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:16px}
.trio .lbl{display:flex;align-items:center;gap:6px;color:var(--hero-muted);font-size:.85rem}
.trio b{display:block;font-size:1.15rem;font-weight:700;text-align:start}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.more{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:500;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none}
.btn.sm{padding:7px 12px;font-size:.9rem;min-height:38px;border-radius:10px}
.btn.danger{color:var(--bad)}
.stepper{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 12px 5px 6px;min-height:46px;font-weight:500}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1}
.stepper b{min-width:1.4em;text-align:center;font-weight:700}

.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.sec{overflow:hidden;--sec:var(--accent);--sec-soft:var(--accent-soft)}
.sec-income{--sec:var(--good);--sec-soft:var(--good-soft)}
.sec-expense{--sec:var(--warm);--sec-soft:var(--warm-soft)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--sec-soft)}
.sec-head h2{font-weight:800;font-size:1.3rem;margin:0;color:var(--sec)}
.sec-head .tot{font-weight:800;font-size:1.15rem}
.sec-head .tot small{font-weight:400;font-size:.8rem;color:var(--muted);direction:rtl}
.note{padding:10px 16px 0;margin:0;color:var(--muted);font-size:.875rem}
.grp-head{display:flex;align-items:center;border-top:1px solid var(--line)}
.grp-tgl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:14px 16px;text-align:start;font-weight:700;min-height:52px}
.grp-tgl .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.cnt{font-weight:500;font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px}
.chev{width:8px;height:8px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-inline:2px 4px}
.grp-tgl[aria-expanded="false"] .chev{transform:rotate(135deg)}
.x{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;font-size:1.3rem;line-height:1;flex:none}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.grp-head .x{margin-inline-end:8px}
.row{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"name amt rm" "meta meta meta";gap:2px 8px;padding:8px 8px 8px 16px;border-top:1px solid var(--line);align-items:center}
[dir="rtl"] .row{padding:8px 16px 8px 8px}
.row .name{grid-area:name;min-width:0;overflow-wrap:anywhere;font-weight:500}
.row .name input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.row .x{grid-area:rm}
.row .meta{grid-area:meta;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.amt{grid-area:amt;display:inline-flex;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding-inline:10px;direction:ltr;height:46px}
.amt:focus-within{border-color:var(--accent);background:var(--surface)}
.amt span{color:var(--muted);font-weight:500}
.amt input{width:92px;border:0;background:none;padding:6px;text-align:right;font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.amt input::placeholder{color:var(--muted);font-weight:400}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.row .meta select{font-size:.85rem;padding:2px 8px;border-radius:999px;color:var(--muted);min-height:28px}
.eq{font-size:.85rem;color:var(--muted)}
@media (min-width:640px){
  .row{grid-template-columns:1fr auto auto auto;grid-template-areas:"name meta amt rm"}
  .row .meta{flex-wrap:nowrap;flex-direction:row-reverse}
}
.sec-foot{padding:12px 16px 16px;border-top:1px solid var(--line)}
.add{width:100%;border:1.5px dashed var(--sec);background:none;color:var(--sec);border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.add:hover{background:var(--sec-soft)}
.empty{padding:16px;color:var(--muted);margin:0;border-top:1px solid var(--line)}

.breakdown{padding:16px;display:flex;flex-direction:column;gap:14px}
.breakdown[hidden]{display:none}
.card-title{font-weight:800;font-size:1.15rem;margin:0}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);direction:ltr}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 20px}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
.legend .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.legend .pc{color:var(--muted);font-size:.85rem;min-width:2.6em;text-align:end}

dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,14,28,.6)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-head h3{font-weight:800;font-size:1.25rem;margin:0}
.dlg-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:46px}
.pick h4,.dlg-body h4{margin:10px 0 8px;font-size:.95rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;text-align:start;min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.custom{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > *{flex:1 1 150px}
.inline > .btn{flex:0 0 auto}
label.small{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
label.small .field{color:var(--ink)}
.tpl{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tpl b{font-weight:700}
.tpl .acts,.tpl.acts{display:flex;gap:8px;flex-wrap:wrap}
label.chk{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="stick" id="stick" aria-hidden="true"></div>
<div class="wrap">

  <div id="banner"></div>

  <section class="card breakdown" id="breakdown" hidden></section>
</div>
<dialog id="dlg"><div class="dlg" id="dlg-inner"></div></dialog>

function uid(){return "i"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function mkItem(key,amount){var c=CK[key];return {id:uid(),key:key,name:null,group:c[1],freq:c[4],amount:amount||0};}
function fresh(){
  var s={v:1,lang:"he",kids:2,example:true,items:[],groups:[],templates:[],updatedAt:0};
  READY[0].keys.split(" ").forEach(function(k){s.items.push(mkItem(k,EXAMPLE[k]));});

function normalize(s){
  if(!s||typeof s!=="object"||!Array.isArray(s.items))return fresh();
  s.lang="he";
  s.kids=Math.max(0,Math.min(15,parseInt(s.kids,10)||0));
  s.groups=Array.isArray(s.groups)?s.groups:[];
  s.templates=Array.isArray(s.templates)?s.templates:[];
  s.items=s.items.filter(function(it){return it&&it.id&&(groupInfo(it.group,s)||false);});
  s.items.forEach(function(it){it.amount=Math.max(0,Number(it.amount)||0);if(!/^(m|bi|y)$/.test(it.freq))it.freq="m";});
  s.updatedAt=Number(s.updatedAt)||0;
  return s;
}
function load(){
  try{var raw=localStorage.getItem(STORE);if(raw)return normalize(JSON.parse(raw));}catch(e){localOk=false;}
  return fresh();
}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(STORE,JSON.stringify(state));localOk=true;}catch(e){localOk=false;}
  if(cloudRef){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,1500);}
  if(gh){ghDirty=true;clearTimeout(ghTimer);ghTimer=setTimeout(ghPush,3000);}

}
function pushCloud(){
  if(!cloudRef||saving||!dirty)return;
  saving=true;dirty=false;
  cloudRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt}).then(function(){
    saving=false;cloudOn=true;drawStatus();if(dirty)pushCloud();
  },function(){saving=false;cloudOn=false;cloudRef=null;drawStatus();});
}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc("data/users/"+id+"/budget");
      return ref.get().then(function(snap){
        cloudRef=ref;cloudOn=true;
        if(snap.exists){
          var d=snap.data(),remote=null;
          try{remote=JSON.parse(d.json);}catch(e){}
          if(remote&&Number(remote.updatedAt)>state.updatedAt){
            var lang=state.lang;state=normalize(remote);
            try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
            renderAll();
          }else if(state.updatedAt>0){dirty=true;pushCloud();}
        }else if(state.updatedAt>0){dirty=true;pushCloud();}
        drawStatus();
      });
    });
  }).catch(function(){});
}

var GH_STORE="il-family-budget-gh",gh=null,ghSha=null,ghState="",ghTimer=null,ghBusy=false,ghDirty=false;
function ghLoadCfg(){try{var r=localStorage.getItem(GH_STORE);if(r){var c=JSON.parse(r);if(c&&c.token&&c.owner&&c.repo&&c.path)return c;}}catch(e){}return null;}
function ghDefaults(){
  var o="DannyGelman95",r="family-budget",m=/^([^.]+)\.github\.io$/i.exec(location.hostname||"");
  if(m){o=m[1];var seg=location.pathname.split("/").filter(Boolean)[0];if(seg&&!/\.html?$/i.test(seg))r=seg;}
  return {owner:o,repo:r,branch:"main",path:"data/budget.json",token:""};
}
function ghRepoUrl(){return "https://api.github.com/repos/"+encodeURIComponent(gh.owner)+"/"+encodeURIComponent(gh.repo);}
function ghUrl(){return ghRepoUrl()+"/contents/"+gh.path.split("/").filter(Boolean).map(encodeURIComponent).join("/");}
function ghHeaders(){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28"};}
function b64enc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function b64dec(b){var s=atob(String(b).replace(/\s/g,"")),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}
function ghSet(k){ghState=k;drawStatus();var e=document.getElementById("gh-msg");if(e)e.textContent=k?t(k):"";}
function ghFail(code){ghSet(code===401||code===403?"ghErrAuth":code===404?"ghErrNotFound":"ghErrNet");}
function adopt(remote){
  var lang=state.lang;state=normalize(remote);state.lang=lang;
  try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
  drawHeader();drawTools();drawSections();
}
function ghGet(){
  return fetch(ghUrl()+"?ref="+encodeURIComponent(gh.branch),{headers:ghHeaders(),cache:"no-store"}).then(function(res){
    if(res.status===404)return null;
    if(!res.ok)throw res.status;
    return res.json();
  });
}
function ghPull(){
  if(!gh||ghBusy)return;
  ghBusy=true;ghSet("ghLoading");
  ghGet().then(function(j){
    ghBusy=false;
    var remote=null;
    if(j){ghSha=j.sha;try{remote=JSON.parse(b64dec(j.content));}catch(e){}}else ghSha=null;
    var rAt=remote?Number(remote.updatedAt)||0:-1;
    if(remote&&rAt>state.updatedAt){adopt(remote);ghSet("ghSynced");if(ghDirty)ghPush();}
    else if(!remote||state.updatedAt>rAt){if(!state.updatedAt)state.updatedAt=1;ghDirty=true;ghPush();}
    else{ghSet("ghSynced");if(ghDirty)ghPush();}
  }).catch(function(err){ghBusy=false;ghFail(typeof err==="number"?err:0);});
}
function ghPush(retried){
  if(!gh||ghBusy||!ghDirty)return;
  ghBusy=true;ghDirty=false;ghSet("ghSaving");
  var body={message:"Update budget data",content:b64enc(JSON.stringify(state,null,2)+"\n"),branch:gh.branch};
  if(ghSha)body.sha=ghSha;
  fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)}).then(function(res){
    if((res.status===409||res.status===422)&&retried!==true){
      return ghGet().then(function(j){ghSha=j?j.sha:null;ghBusy=false;ghDirty=true;ghPush(true);});
    }
    if(!res.ok)throw res.status;
    return res.json().then(function(j){
      ghSha=j&&j.content?j.content.sha:ghSha;ghBusy=false;ghSet("ghSynced");
      if(ghDirty)ghPush();
    });
  }).catch(function(err){ghBusy=false;ghDirty=true;ghFail(typeof err==="number"?err:0);});
}
function ghConnect(cfg){
  gh=cfg;ghSha=null;ghDirty=false;
  try{localStorage.setItem(GH_STORE,JSON.stringify(cfg));}catch(e){}
  ghSet("ghLoading");
  fetch(ghRepoUrl(),{headers:ghHeaders(),cache:"no-store"}).then(function(res){
    if(!res.ok)throw res.status;
    return res.json();
  }).then(function(j){
    if(j&&j.permissions&&j.permissions.push===false)throw 403;
    ghPull();
  }).catch(function(err){ghFail(typeof err==="number"?err:0);});
}
function ghDisconnect(){
  gh=null;ghSha=null;ghDirty=false;ghState="";clearTimeout(ghTimer);
  try{localStorage.removeItem(GH_STORE);}catch(e){}
  drawStatus();
}

function t(k){return L[state.lang][k]||L.en[k]||k;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){var r=Math.round(Math.abs(n));return (n<0&&r>0?"−":"")+"₪"+r.toLocaleString("en-US");}
function groupInfo(gid,s){
  s=s||state;
  if(G[gid])return {id:gid,sec:G[gid][0],name:s.lang==="he"?G[gid][2]:G[gid][1],custom:false};
  for(var i=0;i<s.groups.length;i++)if(s.groups[i].id===gid)return {id:gid,sec:s.groups[i].sec,name:s.groups[i].name,custom:true};
  return null;
}
function groupsOf(sec){
  var out=G_ORDER.filter(function(g){return G[g][0]===sec;});
  state.groups.forEach(function(g){if(g.sec===sec)out.push(g.id);});
  return out;
}
function allGroupIds(){return G_ORDER.concat(state.groups.map(function(g){return g.id;}));}
function groupColor(gid){var i=allGroupIds().indexOf(gid);return "hsl("+((i*47+12)%360)+" 52% 52%)";}
function itemName(it){if(it.key&&CK[it.key])return state.lang==="he"?CK[it.key][3]:CK[it.key][2];return it.name||"";}
function monthly(it){return it.amount/(it.freq==="y"?12:it.freq==="bi"?2:1);}
function sumBy(fn){var s=0;state.items.forEach(function(it){if(fn(it))s+=monthly(it);});return s;}
function secOf(it){var g=groupInfo(it.group);return g?g.sec:null;}
function totals(){
  var inc=sumBy(function(it){return secOf(it)==="income";}),
      exp=sumBy(function(it){return secOf(it)==="expense";}),
      sav=sumBy(function(it){return secOf(it)==="savings";});
  return {inc:inc,exp:exp,sav:sav,left:inc-exp-sav};
}

    "<div class=\"trio\">"+
    "<div><span class=\"lbl\"><i class=\"dot\" style=\"background:var(--hero-good)\"></i>"+t("income")+"</span><b class=\"num\">"+fmt(T.inc)+"</b></div>"+
    "<div><span class=\"lbl\"><i class=\"dot\" style=\"background:#f0a35e\"></i>"+t("expense")+"</span><b class=\"num\">"+fmt(T.exp)+"</b></div>"+
    "<div><span class=\"lbl\"><i class=\"dot\" style=\"background:#8fb0ff\"></i>"+t("savings")+"</span><b class=\"num\">"+fmt(T.sav)+"</b></div></div>";
  document.getElementById("stick").innerHTML="<span>"+t("left")+"</span><b class=\"num "+(neg?"neg":pos?"pos":"")+"\">"+fmt(T.left)+"</b>";

  var denom=Math.max(T.inc,T.exp+T.sav,1),segs="",legend="";
  function line(col,name,v){
    segs+="<span style=\"width:"+(v/denom*100).toFixed(2)+"%;background:"+col+"\"></span>";
    legend+="<li><span class=\"dot\" style=\"background:"+col+"\"></span><span class=\"nm\">"+esc(name)+"</span><b class=\"num\">"+fmt(v)+"</b>"+(T.inc>0?"<span class=\"pc num\">"+Math.round(v/T.inc*100)+"%</span>":"")+"</li>";
  }
  groupsOf("expense").forEach(function(g){
    var v=sumBy(function(it){return it.group===g;});if(v>0)line(groupColor(g),groupInfo(g).name,v);
  });
  if(T.sav>0)line("var(--accent)",t("savings"),T.sav);
  if(T.left>0)line("var(--good)",t("left"),T.left);
  var kidsCost=sumBy(function(it){return it.group==="kids";});
  var kidsLine=kidsCost>0?"<p class=\"muted\" style=\"margin:0\">"+t("kidsCost")+": <b class=\"num\">"+fmt(kidsCost)+"</b> "+t("aMonth")+(state.kids>0?" · <b class=\"num\">"+fmt(kidsCost/state.kids)+"</b> "+t("perChild"):"")+"</p>":"";
  var bd=document.getElementById("breakdown");
  bd.hidden=!segs;
  bd.innerHTML=segs?"<h2 class=\"card-title\">"+t("whereTitle")+"</h2><div class=\"bar\" role=\"img\" aria-label=\""+t("whereTitle")+"\">"+segs+"</div><ul class=\"legend\">"+legend+"</ul>"+(T.inc>0?"<p class=\"small muted\" style=\"margin:0\">"+t("pctNote")+"</p>":"")+kidsLine:"";
}
function shownGroups(){var out=[];state.items.forEach(function(it){if(out.indexOf(it.group)<0)out.push(it.group);});return out;}
function allCollapsed(){var g=shownGroups();return g.length>0&&g.every(function(x){return collapsed[x];});}
function drawTools(){
  document.getElementById("tools").innerHTML=
    "<button type=\"button\" class=\"btn primary\" data-act=\"open-tpl\">"+t("templates")+"</button>"+
    "<span class=\"stepper\"><span>"+t("children")+"</span><button type=\"button\" data-act=\"kids\" data-v=\"-1\" aria-label=\""+t("fewer")+"\">−</button><b class=\"num\" id=\"kids-n\">"+state.kids+"</b><button type=\"button\" data-act=\"kids\" data-v=\"1\" aria-label=\""+t("morek")+"\">+</button></span>"+
    "<div class=\"more\">"+
    "<button type=\"button\" class=\"btn sm\" data-act=\"refresh\">\u21BB "+t("refresh")+"</button>"+
    "<button type=\"button\" class=\"btn sm\" data-act=\"theme\">"+(curTheme()==="dark"?t("themeLight"):t("themeDark"))+"</button>"+
    "<button type=\"button\" class=\"btn sm\" data-act=\"tgl-all\">"+(allCollapsed()?t("expandAll"):t("collapseAll"))+"</button>"+
    "<button type=\"button\" class=\"btn sm\" data-act=\"open-gh\">"+t("ghBtn")+"</button>"+
    "<button type=\"button\" class=\"btn sm\" data-act=\"copy\" id=\"copy-btn\">"+t("copy")+"</button>"+
    "<button type=\"button\" class=\"btn sm ghost danger\" data-act=\"clear\">"+t("clear")+"</button></div>";
  drawStatus();
  document.getElementById("banner").innerHTML=state.example?"<div class=\"banner\"><span>"+t("exampleMsg")+"</span><button type=\"button\" class=\"btn sm\" data-act=\"clear\">"+t("clear")+"</button></div>":"";
}
function curTheme(){
  var a=document.documentElement.getAttribute("data-theme");if(a==="light"||a==="dark")return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function drawStatus(){
  var el=document.getElementById("status");if(!el)return;
  var col="var(--muted)",txt;
  if(gh){
    var err=/^ghErr/.test(ghState);
    col=err?"var(--bad)":ghState==="ghSynced"?"var(--good)":"var(--accent)";
    txt=t("linked")+" <span class=\"num\" style=\"white-space:normal\">"+esc(gh.repo+"/"+gh.path)+"</span>"+(ghState?" · "+t(ghState):"");
  }else{
    var local=state.updatedAt===0?"":cloudOn&&cloudRef?t("savedCloud"):localOk?t("savedLocal"):t("notSaved");
    txt=t("notLinked")+(local?" · "+local:"");
  }
  el.innerHTML="<i class=\"dot\" style=\"background:"+col+"\"></i><span>"+txt+"</span>";
}
function eqHtml(it){return it&&it.freq!=="m"&&it.amount>0?"= <span class=\"num\">"+fmt(monthly(it))+"</span> "+t("perMonth"):"";}
function rowHtml(it){
  var eq=eqHtml(it);
  var name=it.key?esc(itemName(it)):"<input type=\"text\" id=\"nm-"+it.id+"\" data-name=\""+it.id+"\" value=\""+esc(it.name||"")+"\" aria-label=\""+t("customName")+"\">";
  return "<div class=\"row\"><div class=\"name\">"+name+"</div>"+
    "<label class=\"amt\"><span>₪</span><input type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\" placeholder=\"0\" id=\"amt-"+it.id+"\" data-amt=\""+it.id+"\" value=\""+(it.amount?it.amount:"")+"\" aria-label=\""+esc(itemName(it))+"\"></label>"+
    "<button type=\"button\" class=\"x\" data-act=\"rm\" data-id=\""+it.id+"\" aria-label=\""+t("removeItem")+": "+esc(itemName(it))+"\" title=\""+t("removeItem")+"\">×</button>"+
    "<div class=\"meta\"><select id=\"fq-"+it.id+"\" data-freq=\""+it.id+"\" aria-label=\""+t("freq")+"\">"+["m","bi","y"].map(function(f){return "<option value=\""+f+"\""+(it.freq===f?" selected":"")+">"+t(f)+"</option>";}).join("")+"</select>"+
    "<span class=\"eq\" data-eq=\""+it.id+"\">"+eq+"</span></div></div>";
}
function drawSections(){
  var html="";
  ["income","expense","savings"].forEach(function(sec){
    var body="";
    groupsOf(sec).forEach(function(g){
      var items=state.items.filter(function(it){return it.group===g;});if(!items.length)return;
      var open=!collapsed[g],gi=groupInfo(g);
      body+="<div class=\"grp-head\"><button type=\"button\" class=\"grp-tgl\" data-act=\"tgl\" data-id=\""+g+"\" aria-expanded=\""+open+"\"><span class=\"chev\"></span>"+
        (sec==="expense"?"<span class=\"dot\" style=\"background:"+groupColor(g)+"\"></span>":"")+
        "<span class=\"nm\">"+esc(gi.name)+"</span><span class=\"cnt num\">"+items.length+"</span><span class=\"num\" data-sub=\""+g+"\"></span></button>"+
        "<button type=\"button\" class=\"x\" data-act=\"rm-group\" data-id=\""+g+"\" aria-label=\""+t("removeGroup")+": "+esc(gi.name)+"\" title=\""+t("removeGroup")+"\">×</button></div>";
      if(open)body+=items.map(rowHtml).join("");
    });
    if(!body)body="<p class=\"empty\">"+t("empty")+"</p>";
    html+="<section class=\"card sec sec-"+sec+"\"><div class=\"sec-head\"><h2>"+t(sec)+"</h2><span class=\"tot\" data-tot=\""+sec+"\"></span></div>"+
      (sec==="savings"?"<p class=\"note\" style=\"padding-bottom:10px\">"+t("savNote")+"</p>":"")+body+
      "<div class=\"sec-foot\"><button type=\"button\" class=\"add\" data-act=\"open-add\" data-sec=\""+sec+"\">+ "+t("add_"+sec)+"</button></div></section>";
  });
  document.getElementById("sections").innerHTML=html;
  refreshFigures();
}
function refreshFigures(){
  var T=totals(),map={income:T.inc,expense:T.exp,savings:T.sav};
  document.querySelectorAll("[data-tot]").forEach(function(el){el.innerHTML="<span class=\"num\">"+fmt(map[el.getAttribute("data-tot")])+"</span> <small>"+t("perMonth")+"</small>";});
  document.querySelectorAll("[data-sub]").forEach(function(el){var g=el.getAttribute("data-sub");el.textContent=fmt(sumBy(function(it){return it.group===g;}));});
  document.querySelectorAll("[data-eq]").forEach(function(el){
    var it=find(el.getAttribute("data-eq"));
    el.innerHTML=eqHtml(it);
  });
  drawSummary();
}
function renderAll(){drawHeader();drawTools();drawSections();if(dlgMode)drawDialog();}
function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}

/* ---------- dialogs ---------- */
var dlg=document.getElementById("dlg"),dlgInner=document.getElementById("dlg-inner");
function openDialog(mode,sec){dlgMode=mode;dlgSec=sec||null;dlgFilter="";drawDialog();if(!dlg.open){try{dlg.showModal();}catch(e){dlg.setAttribute("open","");}}}
function closeDialog(){dlgMode=null;if(dlg.open)dlg.close();}
dlg.addEventListener("close",function(){dlgMode=null;});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDialog();});
function head(title){return "<div class=\"dlg-head\"><h3>"+title+"</h3><button type=\"button\" class=\"x\" data-act=\"close\" aria-label=\""+t("close")+"\">×</button></div>";}
function pickHtml(){
  var q=dlgFilter.trim().toLowerCase(),out="";
  groupsOf(dlgSec).forEach(function(g){
    var chips=C.filter(function(c){return c[1]===g&&(!q||c[2].toLowerCase().indexOf(q)>-1||c[3].indexOf(q)>-1);}).map(function(c){
      var on=state.items.some(function(it){return it.key===c[0];});
      return "<button type=\"button\" class=\"chip\" data-act=\"toggle\" data-key=\""+c[0]+"\" aria-pressed=\""+on+"\">"+esc(state.lang==="he"?c[3]:c[2])+"</button>";
    }).join("");
    if(chips)out+="<h4>"+esc(groupInfo(g).name)+"</h4><div class=\"chips\">"+chips+"</div>";
  });
  return out||"<p class=\"muted\">"+t("noMatch")+"</p>";
}
function drawDialog(){
  if(dlgMode==="add"){
    var opts=groupsOf(dlgSec).map(function(g){return "<option value=\""+g+"\">"+esc(groupInfo(g).name)+"</option>";}).join("")+"<option value=\"__new\">"+t("newGroup")+"</option>";
    dlgInner.innerHTML=head(t("add_"+dlgSec))+"<div class=\"dlg-body\">"+
      "<input type=\"search\" class=\"field\" id=\"pick-q\" placeholder=\""+t("search")+"\" aria-label=\""+t("search")+"\">"+
      "<div class=\"pick\" id=\"pick\">"+pickHtml()+"</div>"+
      "<form class=\"custom\" id=\"custom-form\"><h4 style=\"margin:0\">"+t("custom")+"</h4><div class=\"inline\">"+
      "<input type=\"text\" class=\"field\" id=\"c-name\" placeholder=\""+t("customName")+"\" aria-label=\""+t("customName")+"\" maxlength=\"60\" required>"+
      "<select id=\"c-group\" aria-label=\""+t("newGroupName")+"\">"+opts+"</select></div>"+
      "<div class=\"inline\"><input type=\"text\" class=\"field\" id=\"c-newgroup\" placeholder=\""+t("newGroupName")+"\" aria-label=\""+t("newGroupName")+"\" maxlength=\"40\" hidden>"+
      "<button type=\"submit\" class=\"btn primary\">"+t("addBtn")+"</button></div></form></div>";
  }else if(dlgMode==="gh"){
    var c=gh||ghDefaults();
    function f(id,key,val,type){return "<label class=\"small\" for=\""+id+"\">"+t(key)+"<input type=\""+(type||"text")+"\" class=\"field\" id=\""+id+"\" value=\""+esc(val)+"\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" dir=\"ltr\" required></label>";}
    dlgInner.innerHTML=head(t("ghTitle"))+"<div class=\"dlg-body\"><p class=\"small\" style=\"margin:0\">"+t("ghIntro")+"</p>"+
      "<form id=\"gh-form\" style=\"display:flex;flex-direction:column;gap:10px\">"+
      "<div class=\"inline\">"+f("gh-owner","ghOwner",c.owner)+f("gh-repo","ghRepo",c.repo)+"</div>"+
      "<div class=\"inline\">"+f("gh-branch","ghBranch",c.branch)+f("gh-path","ghPath",c.path)+"</div>"+
      f("gh-token","ghToken",c.token,"password")+
      "<p class=\"small muted\" style=\"margin:0\">"+t("ghTokenHint")+"</p>"+
      "<div class=\"tpl acts\" style=\"border:0;padding:0;flex-direction:row\"><button type=\"submit\" class=\"btn primary\">"+t("ghConnect")+"</button>"+
      (gh?"<button type=\"button\" class=\"btn ghost danger\" data-act=\"gh-off\">"+t("ghDisconnect")+"</button>":"")+"</div>"+
      "<p id=\"gh-msg\" role=\"status\" style=\"margin:0;font-weight:500\">"+(gh&&ghState?t(ghState):"")+"</p></form></div>";
  }else if(dlgMode==="tpl"){
    var ready=READY.map(function(r){
      return "<div class=\"tpl\"><div><b>"+esc(state.lang==="he"?r.he:r.en)+"</b> <span class=\"muted small\">· "+r.keys.split(" ").length+" "+t("items")+"</span></div><div class=\"acts\"><button type=\"button\" class=\"btn sm primary\" data-act=\"tpl-use\" data-kind=\"ready\" data-id=\""+r.id+"\">"+t("replace")+"</button><button type=\"button\" class=\"btn sm\" data-act=\"tpl-merge\" data-kind=\"ready\" data-id=\""+r.id+"\">"+t("merge")+"</button></div></div>";
    }).join("");
    var mine=state.templates.length?state.templates.map(function(m){
      return "<div class=\"tpl\"><div><b>"+esc(m.name)+"</b> <span class=\"muted small\">· "+m.items.length+" "+t("items")+"</span></div><div class=\"acts\"><button type=\"button\" class=\"btn sm primary\" data-act=\"tpl-use\" data-kind=\"mine\" data-id=\""+m.id+"\">"+t("replace")+"</button><button type=\"button\" class=\"btn sm\" data-act=\"tpl-merge\" data-kind=\"mine\" data-id=\""+m.id+"\">"+t("merge")+"</button><button type=\"button\" class=\"btn sm ghost danger\" data-act=\"tpl-del\" data-id=\""+m.id+"\">"+t("del")+"</button></div></div>";
    }).join(""):"<p class=\"muted\" style=\"margin:0\">"+t("noMine")+"</p>";
    dlgInner.innerHTML=head(t("templates"))+"<div class=\"dlg-body\">"+
      "<h4 style=\"margin:0\">"+t("mine")+"</h4>"+mine+
      "<form class=\"custom\" id=\"tpl-form\" style=\"border-top:0;padding-top:0\"><div class=\"inline\"><input type=\"text\" class=\"field\" id=\"tpl-name\" placeholder=\""+t("tplName")+"\" aria-label=\""+t("tplName")+"\" maxlength=\"50\" required><button type=\"submit\" class=\"btn\">"+t("save")+"</button></div>"+
      "<label class=\"chk\"><input type=\"checkbox\" id=\"tpl-amounts\"> "+t("withAmounts")+"</label><span class=\"muted small\">"+t("saveTpl")+"</span></form>"+
      "<h4 style=\"margin:0\">"+t("ready")+"</h4><p class=\"muted small\" style=\"margin:0\">"+t("replaceHint")+"</p>"+ready+"</div>";
  }
}

/* ---------- templates ---------- */
function tplItems(kind,id){
  if(kind==="ready"){
    var r=READY.filter(function(x){return x.id===id;})[0];if(!r)return null;
    return {groups:[],items:r.keys.split(" ").map(function(k){return {key:k,name:null,group:CK[k][1],freq:CK[k][4]};})};
  }
  return state.templates.filter(function(x){return x.id===id;})[0]||null;
}
function same(a,b){return a.key?a.key===b.key:(!b.key&&a.name===b.name&&a.group===b.group);}
function applyTpl(tpl,mode){
  (tpl.groups||[]).forEach(function(g){if(!groupInfo(g.id))state.groups.push({id:g.id,name:g.name,sec:g.sec});});
  var wasExample=state.example,old=state.items,next=mode==="replace"?[]:old.slice();
  tpl.items.forEach(function(ti){
    if(ti.key&&!CK[ti.key])return;
    if(!groupInfo(ti.group))return;
    var ex=old.filter(function(o){return same(ti,o);})[0];
    if(mode==="merge"){if(ex)return;}
    var amount=typeof ti.amount==="number"?ti.amount:(ex&&!(wasExample&&mode==="replace")?ex.amount:0);
    next.push({id:ex?ex.id:uid(),key:ti.key||null,name:ti.key?null:ti.name,group:ti.group,freq:ex&&typeof ti.amount!=="number"?ex.freq:ti.freq,amount:amount});
  });
  state.items=next;
  if(mode==="replace")state.example=false;
  pruneGroups();
}
function pruneGroups(){
  var inTpl={};state.templates.forEach(function(m){(m.groups||[]).forEach(function(g){inTpl[g.id]=1;});});
  state.groups=state.groups.filter(function(g){return inTpl[g.id]||state.items.some(function(it){return it.group===g.id;});});
}
function summaryText(){
  var T=totals(),lines=[t("title"),""];
  ["income","expense","savings"].forEach(function(sec){
    lines.push(t(sec)+": "+fmt(sec==="income"?T.inc:sec==="expense"?T.exp:T.sav)+" "+t("perMonth"));
    state.items.forEach(function(it){if(secOf(it)===sec&&it.amount>0)lines.push("  "+itemName(it)+": "+fmt(monthly(it)));});
    lines.push("");
  });
  lines.push(t("left")+": "+fmt(T.left));
  return lines.join("\n");
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(act==="lang"){state.lang=b.getAttribute("data-v");persist();renderAll();}
  else if(act==="kids"){state.kids=Math.max(0,Math.min(15,state.kids+Number(b.getAttribute("data-v"))));document.getElementById("kids-n").textContent=state.kids;persist();drawSummary();}
  else if(act==="clear"){state.items.forEach(function(it){it.amount=0;});state.example=false;persist();renderAll();}
  else if(act==="copy"){
    var txt=summaryText();
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy");},1600);},function(){});}catch(err){}
  }
  else if(act==="rm"){state.items=state.items.filter(function(it){return it.id!==id;});pruneGroups();persist();drawSections();}
  else if(act==="rm-group"){state.items=state.items.filter(function(it){return it.group!==id;});pruneGroups();persist();drawSections();}
  else if(act==="open-add"){openDialog("add",b.getAttribute("data-sec"));}
  else if(act==="tgl"){collapsed[id]=!collapsed[id];saveUi();drawTools();drawSections();}
  else if(act==="tgl-all"){var all=allCollapsed();shownGroups().forEach(function(g){collapsed[g]=!all;});saveUi();drawTools();drawSections();}
  else if(act==="open-tpl"){openDialog("tpl");}
  else if(act==="open-gh"){openDialog("gh");}
  else if(act==="refresh"){try{location.reload();}catch(err){if(gh)ghPull();}}
  else if(act==="theme"){
    var nt=curTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nt);
    try{localStorage.setItem("il-family-budget-theme",nt);}catch(err){}
    drawTools();
  }
  else if(act==="gh-off"){ghDisconnect();drawDialog();}
  else if(act==="close"){closeDialog();}
  else if(act==="toggle"){
    var key=b.getAttribute("data-key"),has=state.items.some(function(it){return it.key===key;});
    if(has)state.items=state.items.filter(function(it){return it.key!==key;});else{state.items.push(mkItem(key,0));collapsed[CK[key][1]]=false;}
    b.setAttribute("aria-pressed",String(!has));persist();drawSections();
  }
  else if(act==="tpl-use"||act==="tpl-merge"){
    var tpl=tplItems(b.getAttribute("data-kind"),id);if(!tpl)return;
    applyTpl(tpl,act==="tpl-use"?"replace":"merge");persist();closeDialog();renderAll();
  }
  else if(act==="tpl-del"){state.templates=state.templates.filter(function(m){return m.id!==id;});pruneGroups();persist();drawDialog();}
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-amt")){var it=find(el.getAttribute("data-amt"));if(!it)return;var v=parseFloat(el.value);it.amount=isFinite(v)&&v>0?v:0;persist();refreshFigures();}
  else if(el.hasAttribute("data-name")){var it2=find(el.getAttribute("data-name"));if(it2){it2.name=el.value.slice(0,60);persist();}}
  else if(el.id==="pick-q"){dlgFilter=el.value;document.getElementById("pick").innerHTML=pickHtml();}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute("data-freq")){var it=find(el.getAttribute("data-freq"));if(it){it.freq=el.value;persist();refreshFigures();}}
  else if(el.id==="c-group"){var ng=document.getElementById("c-newgroup");ng.hidden=el.value!=="__new";ng.required=el.value==="__new";if(!ng.hidden)ng.focus();}
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="custom-form"){
    var name=document.getElementById("c-name").value.trim(),g=document.getElementById("c-group").value;
    if(!name)return;
    if(g==="__new"){
      var gn=document.getElementById("c-newgroup").value.trim();if(!gn)return;
      g="g"+uid();state.groups.push({id:g,name:gn,sec:dlgSec});
    }
    state.items.push({id:uid(),key:null,name:name,group:g,freq:"m",amount:0});collapsed[g]=false;
    persist();drawSections();drawDialog();
  }else if(e.target.id==="gh-form"){
    var cfg={};["owner","repo","branch","path","token"].forEach(function(k){cfg[k]=document.getElementById("gh-"+k).value.trim();});
    cfg.path=cfg.path.replace(/^\/+/,"");
    if(!cfg.owner||!cfg.repo||!cfg.branch||!cfg.path||!cfg.token)return;
    ghConnect(cfg);drawDialog();
  }else if(e.target.id==="tpl-form"){
    var tn=document.getElementById("tpl-name").value.trim();if(!tn)return;
    var withAmt=document.getElementById("tpl-amounts").checked,used={};
    var items=state.items.map(function(it){used[it.group]=1;var o={key:it.key||null,name:it.key?null:it.name,group:it.group,freq:it.freq};if(withAmt)o.amount=it.amount;return o;});
    state.templates.push({id:"t"+uid(),name:tn,items:items,groups:state.groups.filter(function(g){return used[g.id];}).map(function(g){return {id:g.id,name:g.name,sec:g.sec};})});
    persist();drawDialog();
  }
});

/* ---------- start ---------- */
state=load();
gh=ghLoadCfg();
renderAll();
initCloud();
if(gh)ghPull();
if("IntersectionObserver" in window){new IntersectionObserver(function(en){document.getElementById("stick").classList.toggle("show",!en[0].isIntersecting);},{threshold:0}).observe(document.getElementById("summary"));}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&gh&&!ghBusy&&!ghDirty&&!dlgMode)ghPull();});
})();
</script>
